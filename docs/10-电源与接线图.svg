<svg viewBox="0 0 680 670" width="1360" height="1340" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>Spider8 电源、ESP32-S3 与 8 路舵机接线图（LEDC 直连版 · 放大 2 倍）</title>
<desc>5V 3A 适配器经 V+ 和 GND 汇流条给 8 个 MG90S 舵机供电，1000 微法电容并联在两条汇流条之间，ESP32-S3 通过 GPIO4、5、6、7、15、16、17、18 输出 PWM 信号，ESP32 的 GND 与舵机地共地。</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="670" fill="#FFFFFF"/>

<line x1="40" y1="46" x2="60" y2="46" stroke="#E24B4A" stroke-width="2.5"/>
<text x="66" y="46" dominant-baseline="central" font-size="11" fill="#5F5E5A">5V 红线</text>
<line x1="150" y1="46" x2="170" y2="46" stroke="#2C2C2A" stroke-width="2.5"/>
<text x="176" y="46" dominant-baseline="central" font-size="11" fill="#5F5E5A">GND 棕线（共地）</text>
<line x1="316" y1="46" x2="336" y2="46" stroke="#378ADD" stroke-width="2.5"/>
<text x="342" y="46" dominant-baseline="central" font-size="11" fill="#5F5E5A">PWM 信号 橙线</text>

<rect x="500" y="64" width="140" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>

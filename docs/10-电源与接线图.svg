<text x="570" y="106" text-anchor="middle" font-size="11" fill="#5F5E5A">DC 母座转端子排</text>

<line x1="530" y1="128" x2="530" y2="164" stroke="#E24B4A" stroke-width="2"/>
<line x1="610" y1="128" x2="610" y2="164" stroke="#2C2C2A" stroke-width="2"/>

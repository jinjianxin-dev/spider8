<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spider8 开发手册 · 从零装通 ESP32-S3 环境</title>
<meta name="description" content="Spider8 四足蜘蛛机器人：ESP-IDF 环境搭建、VS Code 配置、编译烧写、验收与排错的完整交互教程">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="打开目录">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>

  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="3.1" fill="var(--accent)"/>
      <path d="M12 5.2V2.4M12 18.8v2.8M5.2 12H2.4M18.8 12h2.8M7.2 7.2L5.2 5.2M16.8 16.8l2 2M16.8 7.2l2-2M7.2 16.8l-2 2"
            stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="8.2" stroke="var(--accent)" stroke-width="1.2" opacity=".35"/>
    </svg>
    <span>Spider8 开发手册</span>
    <span class="brand-sub">ESP32-S3 · 环境搭建到验收</span>
  </div>

  <div class="topbar-spacer"></div>

  <span class="pill"><span class="dot"></span>M0-1 已验收</span>

  <button class="icon-btn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色">
    <svg id="themeIcon" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <circle cx="8" cy="8" r="3.1"/>
      <path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"/>
    </svg>
  </button>

  <div class="readbar" id="readbar"></div>
</header>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-progress">
      <div class="sb-progress-top">
        <span>学习进度</span>
        <b><span id="doneCount">0</span> / <span id="totalCount">0</span> 节</b>
      </div>
      <div class="bar"><i id="doneBar"></i></div>
    </div>

    <ul class="nav" id="nav"></ul>

    <div class="sb-foot">
      配套文档<br>
      <code>docs/03-环境搭建.md</code><br>
      <code>docs/04-VSCode开发配置.md</code><br>
      <code>docs/05-M0里程碑.md</code>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<button class="totop" id="toTop" title="回到顶部" aria-label="回到顶部">
  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5V3.5M3.6 7.9L8 3.5l4.4 4.4"/></svg>
</button>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
